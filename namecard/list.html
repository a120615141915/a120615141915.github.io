<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>名片清單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #fef3e6 0, rgba(254,243,230,0) 35%), radial-gradient(circle at 80% 10%, #e6f4ff 0, rgba(230,244,255,0) 30%), radial-gradient(circle at 60% 80%, #ecf8ed 0, rgba(236,248,237,0) 28%), #f8fafc;
      --panel: rgba(255,255,255,0.82);
      --text: #0f172a;
      --border: rgba(15,23,42,0.08);
      --shadow: 0 20px 70px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Manrope', 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px 18px 48px;
    }
    .shell {
      width: min(1100px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 26px;
      backdrop-filter: blur(10px);
      padding: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 16px;
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
    }
    .table-wrap {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15,23,42,0.06);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead {
      background: linear-gradient(120deg, #0ea5e9, #0369a1);
      color: #fff;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th:last-child, td:last-child { text-align: right; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr:last-child td { border-bottom: none; }
    .empty {
      text-align: center;
      padding: 18px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1>名片清單</h1>
    <p>資料尚未載入，之後可在此呈現辨識結果或上傳紀錄。</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>暱稱</th>
            <th>姓名</th>
            <th>公司</th>
            <th>職稱</th>
            <th>更新時間</th>
            <th>動作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="empty" colspan="6">目前沒有資料</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
